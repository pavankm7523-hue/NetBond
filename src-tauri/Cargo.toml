[package]
name = "netbond"
version = "0.1.2"
description = "Multi-interface HTTP and BitTorrent download manager for Windows"
authors = ["pavankm7523-hue"]
license = "MIT"
repository = "https://github.com/pavankm7523-hue/NetBond"
edition = "2021"

[lib]
name = "netbond_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
hex = "0.4"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
netbond-route = { path = "vendor/netbond-route" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tower = "0.5"

[patch.crates-io]
hyper-util = { path = "vendor/hyper-util" }
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
librqbit = { path = "vendor/librqbit" }
